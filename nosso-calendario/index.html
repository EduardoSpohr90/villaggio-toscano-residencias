<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nosso Calendário" />
    <meta name="application-name" content="Nosso Calendário" />
    <meta name="description" content="Agenda compartilhada da família: compromissos, tarefas e disponibilidade." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Nosso Calendário</title>
    <script src="/boot.js" defer></script>
  </head>
  <body>
    <div id="app"><div class="boot" aria-hidden="true">Nosso Calendário</div></div>
    <div id="boot-error" class="boot-error" hidden>
      <p><strong>O aplicativo não abriu como esperado.</strong></p>
      <p>Seus compromissos continuam salvos. Toque abaixo para recarregar a versão mais recente.</p>
      <button type="button" id="boot-reset">Recarregar</button>
    </div>
    <noscript>Ative o JavaScript para usar o Nosso Calendário.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
